<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きたむらミュージックスクール</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- Google FontsからNoto Sans JPを読み込む -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <header>
            <div class="l-header p-header">
                <h1 class="p-header__logo">
                    <a href="#" class="p-header__logo-link">
                        <span class="p-header__logo-image">
                            <img src="./img/01_top/logo_pc.svg" alt="logo">
                        </span>
                        <div class="p-header__logo-name">
                            <p class="p-header__logo-upper">
                                きたむら
                            </p>
                            <p class="p-header__logo-lower">
                                ミュージックスクール
                            </p>
                        </div>
                    </a>
                </h1>
                <div class="p-header__hamburger sp">
                    <div class="p-header__hamburger-inner">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <nav class="l-header__nav p-header__nav">
                    <ul>
                        <li class="p-header__nav-item">
                            <a href="#plan">料金</a>
                        </li>
                        <li class="p-header__nav-item">
                            <a href="#blog_list ">ブログ</a>
                        </li>
                        <li class="p-header__nav-item">
                            <a href="#result_list">卒業実績</a>
                        </li>
                        <li class="p-header__nav-item p-header__nav-item--contact">
                            <a href="#contact_form">お問い合わせ</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        <main class="p-top">
            <div class="l-main">
                <!-- FVセクション -->
                <div class="p-top-fv">
                    <div class="p-top-fv__image">
                        <picture>
                            <source media="(min-width: 768px)" srcset="./img/01_top/fv_pc.jpg">
                            <img src="./img/01_top/fv_sp.jpg" alt="音楽で生きるを叶える">
                        </picture>
                    </div>
                    <div class="p-top-fv__contents">
                        <h2 class="p-top-fv__catch">「音楽で生きる」<br class="sp">を叶える<br>ミュージックスクール</h2>
                    </div>
                </div>

                <!-- Visionセクション -->
                <section class="p-top-vision">
                    <div class="l-inner">
                        <div class="p-top-vision__title">
                            <h2>全人類、<br class="sp">ミュージシャン計画。</h2>
                        </div>
                        <div class="p-top-vision__contents">
                            <div class="p-top-vision__desc">
                                <p>私たちは音楽を愛するすべての人が、音楽に熱狂できる世界を目指しています。</p>
                            </div>
                            <div class="p-top-vision__image">
                                <picture>
                                    <source media="(min-width: 768px)" srcset="./img/01_top/vision01_pc.svg">
                                    <img src="./img/01_top/vision01_sp.svg" alt="永遠も瞬間もあなたと共に">
                                </picture>
                            </div>
                            <div class="p-top-vision__goal">
                                <div class="p-top-vision__arrow">
                                    <img src="./img/01_top/vision02_pc.svg" alt="arrow">
                                </div>
                                <div class="p-top-vision__list">
                                    <div class="p-top-vision__item">
                                        <dt class="p-top-vision__eng">Enthusiasm</dt>
                                        <dd class="p-top-vision__jpn">熱狂し</dd>
                                    </div>
                                    <div class="p-top-vision__item">
                                        <dt class="p-top-vision__eng">Envision</dt>
                                        <dd class="p-top-vision__jpn">想像し</dd>
                                    </div>
                                    <div class="p-top-vision__item">
                                        <dt class="p-top-vision__eng">Effulgent</dt>
                                        <dd class="p-top-vision__jpn">輝く存在へ</dd>
                                    </div>
                                </div>
                            </div>
                        </div>
                        

                    </div>
                </section>
            </div>
        </main>
        <footer>
            <div class="l-footer"></div>
        </footer>
    </div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
